name: PrezziSmart Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  send-test-message:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica il progetto
        uses: actions/checkout@v4

      - name: Installa Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa requests
        run: pip install requests

      - name: Avvia bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
        run: python bot.py

      - name: Salva archivio offerte pubblicate
        run: |
          git config user.name "PrezziSmart Bot"
          git config user.email "actions@github.com"
          git add published.json
          git diff --cached --quiet || git commit -m "Aggiorna archivio offerte pubblicate"
          git push
